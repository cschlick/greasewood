# greasewood mac-gateway: keep accepting router advertisements on the vzNAT link.
#
# net.ipv6.conf.all.forwarding=1 (which the gateway needs, to route the Mac into
# the overlay) makes the kernel treat every link as a router port and stop
# autoconfiguring from RAs — but this link's address and default route COME from
# RA (Apple's vmnet NAT66). On networkd-managed images networkd owns the RA
# client, so this is the setting that actually decides it; the equivalent
# per-interface sysctl races interface creation and silently no-ops.
#
# gw-mac installs this as a drop-in beside whatever .network file networkd has
# matched to the link, so it survives netplan regenerating its own config.
[Network]
IPv6AcceptRA=yes
