# greasewood mac-gateway: forward Mac traffic into the overlay.
net.ipv6.conf.all.forwarding=1

# NOTE: the per-interface companion to this (accept_ra=2 on the vzNAT link, so
# forwarding=1 doesn't make the kernel ignore the RAs that link's address and
# default route come from) is deliberately NOT here. sysctl.d is applied by
# systemd-sysctl at boot, which runs BEFORE the interface has been renamed to
# lima0 — the write just fails and is ignored:
#
#   systemd-sysctl[294]: Couldn't write '2' to 'net/ipv6/conf/lima0/accept_ra',
#                        ignoring: No such file or directory
#
# So it never took effect. It is applied where ordering is actually guaranteed:
# a systemd-networkd drop-in on networkd-managed images (IPv6AcceptRA=yes, which
# is what really governs RA there), and in gw-mac-gateway's start() on OpenRC,
# which runs after `need net`. gw-mac installs whichever fits the guest.
